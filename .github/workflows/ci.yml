# Continuous integration: every check that decides whether a change is safe to
# merge. Runs on pull requests, weekly on main (so newly published CVEs in the
# base image are caught even when nothing changes), and is called by the CD
# workflow so a release is only published after the same checks pass.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called from CD, so this never
  # collides with the CD run's own group.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
      - name: Ruff lint
        run: python -m ruff check --output-format=github .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: mypy
        run: python -m mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the container runs; 3.14 catches upcoming breakage early.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      # The deploy-script tests render the real overlays with kustomize.
      - uses: ./.github/actions/setup-tools
        with:
          tools: kustomize
      - name: pytest with coverage
        run: make test
      - name: Coverage summary
        if: always()
        run: python -m coverage report --format=markdown >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload coverage and test results
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  static:
    name: Validate Dockerfile, scripts, workflows and manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          tools: actionlint hadolint kubeconform kustomize shellcheck trivy
      - name: hadolint
        run: make lint-dockerfile
      - name: shellcheck
        run: make lint-shell
      - name: actionlint
        run: make lint-workflows
      - name: kustomize build + kubeconform
        run: make validate-manifests
      - name: Trivy misconfiguration scan
        run: make scan-config

  image:
    name: Build, smoke-test and scan image
    needs: [lint, test, static]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload Trivy results to code scanning
    env:
      IMAGE: distance-api:ci-${{ github.sha }}
      APP_VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      - name: Run container with the production security settings
        run: |
          docker run -d --name api -p 8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e APP_ENVIRONMENT=ci "${IMAGE}"
          # Wait for the Dockerfile HEALTHCHECK to report healthy.
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' api)"
            echo "health: ${status}"
            [[ "${status}" == healthy ]] && exit 0
            sleep 2
          done
          docker logs api
          exit 1

      - name: Smoke-test container
        run: |
          python3 scripts/smoke_test.py --base-url http://127.0.0.1:8000 \
            --expected-version "${APP_VERSION}" --expected-environment ci

      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tail -n 50; docker rm -f api

      - name: Trivy vulnerability scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "0"
          skip-setup-trivy: true

      # Pull requests from forks get a read-only token and cannot upload.
      - name: Upload to code scanning
        if: always() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          artifact-name: sbom-ci.spdx.json
          upload-release-assets: false
