# Continuous delivery.
#
#   push to main     -> CI -> publish image -> deploy to staging
#   push tag v*.*.*  -> CI -> publish image -> deploy to staging
#                       -> (manual approval) -> deploy to production -> GitHub release
#
# The image is built once per run and every later stage deploys that exact
# digest, so production receives precisely the bytes that passed staging.
# Each environment is a throwaway kind cluster: it is first rebuilt with the
# release currently live there, then the new release is rolled over it, so a
# failed smoke test exercises a genuine `kubectl rollout undo`.
name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      simulate_failed_release:
        description: Make the staging smoke tests expect the wrong version, to watch the automatic rollback
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  publish:
    name: Publish image to GHCR
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      repository: ${{ steps.names.outputs.repository }}
      image: ${{ steps.names.outputs.repository }}@${{ steps.build.outputs.digest }}
      version: ${{ steps.names.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out image name and version
        id: names
        run: |
          # GHCR repository names must be lower case.
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=distance-api

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.names.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
          # Signed build provenance and an SBOM are attached to the image in the registry.
          provenance: mode=max
          sbom: true

      - name: SBOM for the published image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.names.outputs.repository }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          artifact-name: sbom-${{ steps.names.outputs.version }}.spdx.json
          upload-release-assets: false

      - name: Summary
        env:
          REPOSITORY: ${{ steps.names.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.names.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published ${VERSION}"
            echo
            echo "\`${REPOSITORY}@${DIGEST}\`"
            echo
            echo "Tags:"
            while read -r tag; do echo "- \`${tag}\`"; done <<<"${TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"

  staging:
    name: Deploy to staging
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # to move the "staging" tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/promote
        with:
          environment: staging
          repository: ${{ needs.publish.outputs.repository }}
          image: ${{ needs.publish.outputs.image }}
          version: ${{ needs.publish.outputs.version }}
          simulate-failure: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failed_release }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  production:
    name: Deploy to production
    needs: [publish, staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Configure required reviewers on this environment (Settings > Environments)
    # and the job waits here for a manual approval.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # to move the "production" tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/promote
        with:
          environment: production
          repository: ${{ needs.publish.outputs.repository }}
          image: ${{ needs.publish.outputs.image }}
          version: ${{ needs.publish.outputs.version }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: GitHub release
    needs: [publish, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ needs.publish.outputs.version }}.spdx.json
          path: sbom

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.publish.outputs.image }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease=(--prerelease); fi
          # Indented block rather than a fenced one: it renders as code either way.
          notes="$(printf 'Container image, verified in staging and then production:\n\n    docker pull %s\n' "${IMAGE}")"
          gh release create "${GITHUB_REF_NAME}" sbom/*.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${notes}" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
