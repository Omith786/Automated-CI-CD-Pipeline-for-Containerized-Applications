name: Promote a release to an environment
description: >-
  Look up the release currently live in an environment (the image carrying the
  environment's moving tag), deploy the new release over it in kind with
  automatic rollback, and on success move the environment's tag to the new
  digest so the next run treats it as the live release.

inputs:
  environment:
    description: staging or production.
    required: true
  repository:
    description: Image repository, e.g. ghcr.io/owner/name.
    required: true
  image:
    description: Image to deploy, as repository@sha256:digest.
    required: true
  version:
    description: Version the new pods must report.
    required: true
  simulate-failure:
    description: Passed through to kind-deploy.
    required: false
    default: "false"
  registry-username:
    description: GHCR user.
    required: true
  registry-password:
    description: GHCR token with packages:write.
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Find the live ${{ inputs.environment }} release
      id: live
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        live="$(scripts/resolve-digest.sh "${REPOSITORY}:${ENVIRONMENT}")"
        echo "image=${live}" >> "${GITHUB_OUTPUT}"
        echo "live ${ENVIRONMENT} release: ${live:-none (first deployment)}"

    - uses: ./.github/actions/kind-deploy
      with:
        environment: ${{ inputs.environment }}
        image: ${{ inputs.image }}
        previous-image: ${{ steps.live.outputs.image }}
        expect-version: ${{ inputs.version }}
        simulate-failure: ${{ inputs.simulate-failure }}
        registry-username: ${{ inputs.registry-username }}
        registry-password: ${{ inputs.registry-password }}

    - name: Mark ${{ inputs.version }} as the live ${{ inputs.environment }} release
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGE: ${{ inputs.image }}
      run: |
        # Re-points the tag at the existing manifest; nothing is rebuilt or re-uploaded.
        docker buildx imagetools create --tag "${REPOSITORY}:${ENVIRONMENT}" "${IMAGE}"
        echo "::notice::${ENVIRONMENT} now points at ${IMAGE}"
