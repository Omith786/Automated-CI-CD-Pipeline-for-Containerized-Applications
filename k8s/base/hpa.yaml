apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: distance-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: distance-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Scale up quickly, scale down cautiously to avoid flapping.
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
